<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1f2937;
            background: #f8fafc;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 20px 64px;
        }
        h1 { font-size: 1.6rem; margin: 0 0 8px; }
        h2 { font-size: 1.15rem; margin: 28px 0 8px; }
        p { line-height: 1.45; }
        button {
            font: inherit;
            background: #1d4ed8;
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
        }
        button.secondary { background: #e5e7eb; color: #1f2937; }
        .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .note { color: #4b5563; }
        .error { color: #991b1b; }
        .panel {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px 16px 8px;
            margin-top: 12px;
        }
        .bar-row {
            display: grid;
            grid-template-columns: 180px 1fr 36px;
            gap: 8px;
            align-items: center;
            margin: 8px 0;
        }
        .bar-label { font-size: 0.92rem; }
        .bar-track { background: #e5e7eb; border-radius: 6px; height: 14px; }
        .bar-fill { background: #2563eb; height: 14px; border-radius: 6px; }
        .bar-value { text-align: right; font-variant-numeric: tabular-nums; }
        @media (max-width: 640px) {
            .bar-row { grid-template-columns: 1fr 40px; }
            .bar-track { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Usage</h1>
        <p class="note">iPhone opens and Android finished trips. These are separate. Test phones are left out.</p>
        <p id="status" class="note"></p>

        <section id="gate">
            <p>This page opens only for sbschram@gmail.com. The email link works on any computer.</p>
            <button id="send-link" type="button">Email me a sign-in link</button>
            <p id="signin-error" class="error" hidden></p>
        </section>

        <section id="signed-in" hidden>
            <div class="row">
                <button id="refresh" class="secondary" type="button">Refresh</button>
                <button id="sign-out" class="secondary" type="button">Sign out</button>
            </div>
        </section>

        <section id="charts" hidden>
            <div class="panel">
                <h2>iPhone</h2>
                <p id="ios-caption" class="note"></p>
                <p id="ios-error" class="error" hidden></p>
                <div id="ios-bars"></div>
            </div>
            <div class="panel">
                <h2>Android trips</h2>
                <p id="android-caption" class="note"></p>
                <p id="android-error" class="error" hidden></p>
                <h2>How trips ended</h2>
                <div id="android-end-bars"></div>
                <h2>Points marked</h2>
                <div id="android-point-bars"></div>
            </div>
        </section>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="assets/js/usage.js?v=20261119060000"></script>
</body>
</html>
